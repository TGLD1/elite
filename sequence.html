    <!-- En-tête de la séquence avec cercle de progression -->
    <div style="background-color: #085691; padding: 20px 15px 10px 15px; border-radius: 0 0 20px 20px; margin-bottom: 10px;">

            <h3 id="titre-sequence" style="color: white; font-size: 16px; flex:1; text-align: center; margin: 0;">Chargement...</h3>
            <div class="module-progress-ring">
                <svg viewBox="0 0 40 40">
                    <circle id="ring-circle" cx="20" cy="20" r="16" stroke-dasharray="100.53" stroke-dashoffset="100.53" />
                </svg>
                <span id="ring-percent">0%</span>
            </div>
        </div>
        <div class="seq-presentation">
            <p id="presentation-sequence"></p>
            <div class="seq-skills" id="liste-competences"></div>
        </div>
    </div>

    <!-- Liste des Activités -->
